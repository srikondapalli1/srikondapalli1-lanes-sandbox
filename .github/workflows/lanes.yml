# generated by lanes init (0.1.8); schedules removed for this throwaway sandbox (queue runs on the `queue` label or manual dispatch)
name: lanes
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
jobs:
  check:
    # labeled events only wake the queue job (which re-checks); skip them here to avoid duplicate runs
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; elif [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx lanes check --ci --pr ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
  queue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'queue') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'queue'))))
    concurrency: { group: lanes-queue, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; elif [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: git config user.name "lanes-queue[bot]" && git config user.email "lanes-queue@users.noreply.github.com"
      - run: npx lanes queue
        env:
          GH_TOKEN: ${{ github.token }}
  nightly:
    if: github.event_name == 'schedule' && github.event.schedule == '23 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; elif [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx lanes check --ci --seed random --file-blockers
        env:
          GH_TOKEN: ${{ github.token }}
